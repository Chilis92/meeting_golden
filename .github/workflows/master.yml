name: Master git workflow

on:
  push:
    branches: ["master"]

jobs:
  build:

    name: Maven build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: golden_db
        ports:
          - '3306:3306'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "adopt"

      - name: Maven build
        run: mvn clean install

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # or ${{ github.actor }} for GitHub Packages
          password: ${{ secrets.DOCKER_PAT }} # or ${{ secrets.DOCKER_PASSWORD }} or ${{ secrets.GITHUB_TOKEN }} for GitHub Packages

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: abrhernandez/meeting_golden:latest # Replace with your image name and tag
